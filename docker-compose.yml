services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syndicateos_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:syndicate_secure_pass_2026@db:5432/syndicateos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - syndicate_net

  db:
    image: postgres:16-alpine
    container_name: syndicateos_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=syndicate_secure_pass_2026
      - POSTGRES_DB=syndicateos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syndicateos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syndicate_net

volumes:
  pgdata:
    driver: local

networks:
  syndicate_net:
    driver: bridge
